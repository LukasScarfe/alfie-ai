<!doctype html>
<!-- The Alfie card alone, no HA, for ./dev face. Query:
       sheet=moods                  all 12 expressions
       sheet=anim&name=nod&n=8      n frames through one animation
       sheet=energy&expr=neutral    one expression across energy levels
       sheet=shapes                 head/eye shape combinations across expressions
       sheet=personality            each preset across expressions and an animation frame
       sheet=screen&type=label&opts=<json>&data=<json>[&present=corner&u=1]   one screen
       sheet=present                label screen, both presenting styles, u = 0, .25, .5, 1, and the four corners
       sheet=font                   every glyph of the vector font, large
       expr=happy[&anim=X&u=0.3]    one face
     plus cfg=<url-encoded JSON card config> and cols=N. -->
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1c1c1c; color: #ccc; font: 14px sans-serif;
         --primary-text-color: #e1e1e1; --primary-color: #03a9f4; }
  #g { display: grid; gap: 10px; padding: 10px; }
  figure { margin: 0; text-align: center; }
  alfie-card { display: block; background: #000; }
</style>
<div id="g"></div>
<script type="module">
  // The card waits for HA's own element before defining itself.
  customElements.define("home-assistant", class extends HTMLElement {});
  await import("../custom_components/alfie/frontend/alfie-card.js?v=dev");
  await customElements.whenDefined("alfie-card");

  const q = new URLSearchParams(location.search);
  const cfg = { card: false, ...(q.get("cfg") ? JSON.parse(q.get("cfg")) : {}) };
  const face = await (await fetch("../custom_components/alfie/frontend/alfie-face.json")).json();
  let frames = [];
  const sheet = q.get("sheet");
  if (sheet === "moods") {
    frames = Object.keys(face.expressions).map((e) => ({ label: e, expression: e }));
  } else if (sheet === "anim") {
    const name = q.get("name"), n = Number(q.get("n") || 8);
    const a = face.animations[name];
    const len = a.length ?? a.keys.reduce((s, k) => s + k[0], 0) + 0.45;
    for (let i = 0; i < n; i++) {
      const u = (len * i) / (n - 1 || 1);
      frames.push({ label: `${name} ${u.toFixed(2)}s`, expression: q.get("expr") || "neutral", animation: name, u });
    }
  } else if (sheet === "energy") {
    for (const energy of [1, 0.8, 0.55, 0.35, 0.2]) {
      frames.push({ label: `energy ${energy}`, expression: q.get("expr") || "neutral", energy });
    }
  } else if (sheet === "shapes") {
    const combos = {
      "square head": { head: { type: "polygon", sides: 4, roundness: 0.12 } },
      "star eyes": { eye: { type: "star", points: 5, inner: 0.5 } },
      squircle: { head: { type: "superellipse", n: 4 }, eye: { type: "superellipse", n: 3.5 } },
      "hex + triangles": { head: { type: "polygon", sides: 6 }, eye: { type: "polygon", sides: 3, roundness: 0.25 } },
      diamonds: { eye: { type: "polygon", sides: 4, rotation: 45, stretch: [0.8, 1] } },
    };
    for (const [label, shapes] of Object.entries(combos)) {
      for (const e of (q.get("exprs") || "neutral,angry,happy,sleepy").split(",")) {
        frames.push({ label: `${label}: ${e}`, expression: e, cfg: { shapes } });
      }
    }
  } else if (sheet === "personality") {
    const cells = [["happy"], ["angry"], ["sad"], ["surprised"], ["neutral", "glance_left", 0.45]];
    for (const name of Object.keys(face.personalities)) {
      for (const [e, anim, u] of cells) {
        frames.push({ label: `${name}: ${anim || e}`, expression: e, animation: anim, u, cfg: { personality: name } });
      }
    }
  } else if (sheet === "screen" || sheet === "present" || sheet === "font") {
    const J = (k, d) => (q.get(k) ? JSON.parse(q.get(k)) : d);
    const base = { type: q.get("type") || "label", options: J("opts", {}), data: J("data", null), t: Number(q.get("t") || 0) };
    if (sheet === "font") {
      base.options = { text: "ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789 :.-\u00b0%'!", size: 0.3 };
      frames = [{ ...base, label: "font", present: "handover", u: 1 }];
      cfg.aspect = 1.6;
      cfg.screen_line_width = 0.012;
    } else if (sheet === "screen") {
      frames = [{ ...base, label: base.type, present: q.get("present") || "handover", corner: q.get("corner") || "bottom_right", u: Number(q.get("u") || 1) }];
      cfg.aspect = Number(q.get("aspect") || 1.6);
    } else {
      base.options = { text: "Hello Alfie, this is a screen" };
      for (const present of ["handover", "corner"]) {
        for (const u of [0, 0.25, 0.5, 1]) frames.push({ ...base, label: `${present} u=${u}`, present, u });
      }
      for (const corner of ["bottom_right", "bottom_left", "top_right", "top_left"]) {
        frames.push({ ...base, label: corner, present: "corner", corner, u: 1 });
      }
      cfg.aspect = 1.6;
    }
    const info = await (await fetch(`../custom_components/alfie/frontend/screens/${base.type}.json`)).json();
    for (const f of frames) f.typeInfo = info;
  } else {
    frames = [{ label: q.get("expr") || "neutral", expression: q.get("expr") || "neutral",
                animation: q.get("anim"), u: Number(q.get("u") || 0) }];
  }
  const g = document.getElementById("g");
  g.style.gridTemplateColumns = `repeat(${q.get("cols") || (sheet === "present" ? 4 : sheet === "screen" || sheet === "font" ? 1 : sheet === "shapes" ? 4 : sheet === "personality" ? 5 : Math.min(frames.length, 6))}, 1fr)`;
  for (const f of frames) {
    const fig = document.createElement("figure");
    const el = document.createElement("alfie-card");
    el.setConfig({ ...cfg, ...(f.cfg || {}) });
    fig.appendChild(el);
    fig.insertAdjacentHTML("beforeend", `<figcaption>${f.label}</figcaption>`);
    g.appendChild(fig);
    if (f.type) await el.renderScreenStill(f); else await el.renderStill(f);
  }
  document.body.dataset.ready = "1";
</script>
