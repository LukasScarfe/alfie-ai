set_expression:
  fields:
    expression:
      required: true
      example: happy
      selector:
        select:
          options: [auto, neutral, angry, sad, bored, skeptical, happy, surprised, alarmed,
                    suspicious, sleepy, confused, closed]
    duration:
      example: 30
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
play_animation:
  fields:
    animation:
      required: true
      example: wink_left
      selector:
        select:
          options: [wink_left, wink_right, look_around, glance_left, glance_right, nod, shake,
                    eye_roll, startle, double_take, laugh, sigh, squint, flinch, scan,
                    processing, glitch, dizzy, nod_off, wake_up]
