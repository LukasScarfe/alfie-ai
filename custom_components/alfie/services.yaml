set_expression:
  fields:
    expression:
      required: true
      example: happy
      selector:
        select:
          options: [auto, neutral, angry, sad, bored, skeptical, happy, surprised, alarmed,
                    suspicious, sleepy, confused, closed]
    duration:
      example: 30
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
play_animation:
  fields:
    animation:
      required: true
      example: wink_left
      selector:
        select:
          options: [wink_left, wink_right, look_around, glance_left, glance_right, nod, shake,
                    eye_roll, startle, double_take, laugh, sigh, squint, flinch, scan,
                    processing, glitch, dizzy, nod_off, wake_up]
show_screen:
  fields:
    screen:
      required: true
      example: weather
      selector:
        text:
    duration:
      default: 20
      example: 20
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
play_story:
  fields:
    story:
      required: true
      example: bad_news
      selector:
        text:
    priority:
      default: 60
      example: 60
      selector:
        number:
          min: 0
          max: 100
    busy:
      default: auto
      selector:
        select:
          options: [auto, queue, interrupt, skip]
stop_story:
show_icon:
  fields:
    icon:
      required: true
      example: mdi:white-balance-sunny
      selector:
        icon:
    style:
      default: transform
      selector:
        select:
          translation_key: icon_style
          options: [transform, beside, overlay]
    transform:
      default: whole
      selector:
        select:
          translation_key: icon_transform
          options: [whole, ring]
    seconds:
      default: 5
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
    transition:
      example: zoom
      selector:
        text:
    corner:
      default: card
      selector:
        select:
          translation_key: icon_corner
          options: [card, top_left, top_right, bottom_left, bottom_right]
    place:
      default: top_right
      selector:
        select:
          translation_key: icon_place
          options: [above, below, left, right, top_left, top_right, bottom_left,
                    bottom_right, centre, custom]
    x:
      default: 0
      selector:
        number:
          min: -1
          max: 1
          step: 0.05
    "y":
      default: 0
      selector:
        number:
          min: -1
          max: 1
          step: 0.05
    size:
      default: 1
      selector:
        number:
          min: 0.3
          max: 2
          step: 0.05
    color:
      default: line
      selector:
        select:
          translation_key: icon_color
          options: [line, accent, text]
    fill:
      default: soft
      selector:
        select:
          translation_key: icon_fill
          options: [none, soft, solid]
clear_icons:
set_mood:
  fields:
    level:
      required: true
      example: sad
      selector:
        text:
    duration:
      example: 600
      selector:
        number:
          min: 0
          max: 604800
          unit_of_measurement: s
set_alfie:
  fields:
    state:
      required: true
      example: asleep
      selector:
        text:
    duration:
      example: 3600
      selector:
        number:
          min: 0
          max: 604800
          unit_of_measurement: s
show_rotation:
  fields:
    rotation:
      required: true
      example: living_room
      selector:
        text:
    duration:
      example: 600
      selector:
        number:
          min: 0
          max: 604800
          unit_of_measurement: s
set_personality:
  fields:
    preset:
      required: true
      example: grumpy
      selector:
        text:
    duration:
      example: 3600
      selector:
        number:
          min: 0
          max: 604800
          unit_of_measurement: s
set_mode:
  fields:
    mode:
      required: true
      example: night
      selector:
        text:
    duration:
      example: 7200
      selector:
        number:
          min: 0
          max: 604800
          unit_of_measurement: s
set_enabled:
  fields:
    item:
      required: true
      example: signal.monstera_dry
      selector:
        text:
    enabled:
      required: true
      default: false
      selector:
        boolean:
